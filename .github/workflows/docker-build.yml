name: Docker Build

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write   # pushes the built image to ghcr.io; also the GitHub Packages Maven fallback

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/${{ github.repository_owner }}/school-saas

jobs:
  docker-build:
    name: Docker Build
    runs-on: self-hosted

    steps:
      - name: Checkout school-saas
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Hands this runner's ~/.m2/repository to the Build image step as a build context.
      - name: Resolve shared Maven local repo path
        id: m2
        run: echo "path=$HOME/.m2/repository" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes to ghcr.io/<org>/school-saas on every main push, tagged with both the immutable
      # commit SHA (what k8s/base/deployment.yaml's REPLACE_WITH_GIT_SHA placeholder expects a CD
      # pipeline to substitute) and `latest`. Runs only on main, not on every develop push: main is
      # the only branch guaranteed to have every com.altafjava.platform:* dependency it needs
      # already published to mavenLocal (platform-saas's own publish-snapshot.yml is main-triggered
      # too), and it's the only branch this image would ever actually be built from for real —
      # building on every develop push conflates "compiles" with "releasable" and wastes runner
      # time on images nothing will ever use. Mirrors platform-saas's own ci.yml/publish-snapshot.yml
      # split (test on develop, publish on main).
      #
      # github_actor/platform_saas_token are a GitHub Packages Maven-resolution fallback only —
      # unrelated to this step's own registry auth (the login step above).
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            platform-m2=${{ steps.m2.outputs.path }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          secrets: |
            github_actor=${{ github.actor }}
            platform_saas_token=${{ secrets.PLATFORM_SAAS_TOKEN }}
