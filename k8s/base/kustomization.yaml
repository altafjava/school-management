apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml

# Deliberately not included, unlike platform-saas's template (k8s/ in platform-saas):
# - external-secret.yaml (AWS Secrets Manager wiring) — depends on which secrets backend and
#   cloud account this actually deploys into; provision `school-secrets` however your cluster's
#   operator already manages secrets rather than assuming AWS.
# - ingress.yaml, db-backup-cronjob.yaml, db-restore-drill-cronjob.yaml — same reasoning:
#   host/TLS/backup-target details are specific to the real deployment target, not safe to guess
#   here.
# Copy the equivalent files from platform-saas/k8s/base/ as a starting point once those details
# are known.
