plugins {
    id 'java-library'
    id 'jacoco'
}

// Line/branch coverage reporting for this module. Report-only for now (no
// jacocoTestCoverageVerification minimum) — see TESTING.md §2 for why a real coverage baseline
// must be measured before a threshold is enforced, mirroring platform-saas's own approach.
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('test') {
    finalizedBy jacocoTestReport
}

dependencies {
    api project(':application')
    // Platform api — exposes Spring Web, validation, OpenAPI
    api 'com.altafjava.platform:api'

    // Spring Security and MapStruct are implementation-scoped in the platform's api module
    // so they are not transitively visible — declare them explicitly here
    implementation libs.spring.boot.starter.security
    implementation libs.mapstruct
    // Tenant-scoped rate limiting on the highest-cost endpoints (bulk import, report/certificate
    // generation) — see RateLimitAspect. Reuses platform's own ProxyManager<String> bean (Redis-
    // backed bucket4j) rather than platform's RateLimitInterceptor, which is a flat per-tenant
    // request-count limit applied to every endpoint uniformly and has no notion of one endpoint
    // being far more expensive per call than another.
    implementation libs.bucket4j.core
    implementation libs.aspectjweaver

    annotationProcessor libs.mapstruct.processor
    annotationProcessor libs.lombok.mapstruct.binding
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.mockito.core
    testImplementation libs.mockito.junit.jupiter
}

sourceSets {
    main {
        java {
            srcDir 'build/generated/sources/annotationProcessor/java/main'
        }
    }
}
